<app-status-card
  [label]="'season.current' | translate"
  [icon]="season()?.icon || 'fa-cloud'"
  [value]="season() ? (season()?.labelKey | translate) : (loading() ? ('common.loading' | translate) : ('season.none' | translate))"
  [tone]="season()?.id === 'drought' ? 'warning' : season()?.id === 'badwater' ? 'danger' : season() ? 'info' : 'neutral'"
/>
