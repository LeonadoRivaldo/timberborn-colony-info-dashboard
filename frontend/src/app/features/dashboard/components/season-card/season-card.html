<div class="season" [class.drought]="season()?.id === 'drought'" [class.badwater]="season()?.id === 'badwater'" role="status" aria-label="Clima atual">
  <i class="fa-solid {{ season()?.icon || 'fa-cloud' }}" aria-hidden="true"></i>
  <div><small>CLIMA ATUAL</small><strong>{{ season()?.label || (loading() ? 'Carregando...' : 'Sem sinal') }}</strong></div>
</div>
