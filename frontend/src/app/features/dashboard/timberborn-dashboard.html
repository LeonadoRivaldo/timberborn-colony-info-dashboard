<app-dashboard-shell
  [staticMode]="true"
  [colonies]="colonies()"
  [colony]="colony()"
  [adapters]="adaptersState().data ?? []"
  [adaptersLoading]="adaptersState().loading"
  [adaptersError]="adaptersState().error"
  [indicatorConfigurations]="indicatorsState().data ?? []"
  [indicatorsLoading]="indicatorsState().loading"
  [indicatorsError]="indicatorsState().error"
  [levers]="leversState().data ?? []"
  [leversLoading]="leversState().loading"
  [leversError]="leversState().error"
  [leverSaving]="savingLevers()"
  [leverWriteError]="leverWriteError()"
  [colonyLoading]="colonyState().loading"
  [colonyError]="colonyState().error"
  (toggleLever)="toggleLever($event.id, $event.state)"
>
  <app-summary-panel dashboard-summary [colony]="colony()" />
  <app-goods-panel
    dashboard-goods
    [goods]="colony()?.resources?.goods ?? []"
    [loading]="colonyState().loading"
    [stockAvailable]="colony()?.resources?.stockAvailable !== false"
  />
</app-dashboard-shell>
