<app-dashboard-shell
  [colonies]="colonies.state().data.map((item) => item.data)"
  [colonyId]="colonies.selectedId()"
  [colony]="colony()"
  [adapters]="adapters().data ?? []"
  [adaptersLoading]="adapters().loading"
  [adaptersError]="adapters().error"
  [indicatorConfigurations]="indicatorConfigurations().data ?? []"
  [indicatorsLoading]="indicatorConfigurations().loading || adapters().loading"
  [indicatorsError]="indicatorConfigurations().error"
  [indicatorSaveError]="indicatorWriteError()"
  [levers]="levers().data ?? []"
  [leversLoading]="levers().loading"
  [leversError]="levers().error"
  [leverSaving]="savingLevers()"
  [leverWriteError]="leverWriteError()"
  [colonyLoading]="colonies.state().loading"
  [colonyError]="colonies.state().error"
  (toggleLever)="toggleLever($event.id, $event.state)"
  (selectColony)="selectColony($event)"
  (saveIndicator)="saveIndicator($event)"
  (removeIndicator)="removeIndicator($event)"
>
  <app-summary-panel dashboard-summary [colony]="colony()" />
  <app-goods-panel
    dashboard-goods
    [goods]="colony()?.resources?.goods ?? []"
    [loading]="colonies.state().loading"
    [stockAvailable]="colony()?.resources?.stockAvailable !== false"
  />
</app-dashboard-shell>
