@if (trend()) { <app-goods-trend class="summary-trend" [trend]="trend()" /> }
<div class="overview-label" [class.has-trend]="trend() && trend()?.type !== 'Stable'">
  @if (gameIconId() || gameIconPath()) {
    <app-good-icon [goodId]="gameIconId() || 'custom-icon'" [imagePath]="gameIconPath()" [fallbackIcon]="icon()" />
  } @else {
    <i class="fa-solid {{ icon() }}" aria-hidden="true"></i>
  }
  {{ label() }}
</div>
@if (population()) { <app-population-info class="population-info" [population]="population()" /> }
<div class="stat-value">
  {{ value() ?? '--' }}
  @if (unit()) {
    <span class="stat-unit">{{ unit() }}</span>
  }
</div>

@if (fillBar()) {
  <div class="mini-track" aria-hidden="true">
    <span [style.width.%]="fill()"></span>
  </div>
}

@for (detail of details(); track $index) {
  <div class="stat-detail" [innerHTML]="detail"></div>
}
