name: Deploy Colony Info to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate public Firebase configuration
        working-directory: frontend
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = process.env.FIREBASE_CONFIG
            ? JSON.parse(process.env.FIREBASE_CONFIG)
            : JSON.parse(readFileSync('public/firebase-config.json', 'utf8'));
          for (const key of ['apiKey', 'authDomain', 'projectId', 'appId']) {
            if (typeof config[key] !== 'string' || !config[key]) throw new Error(`Missing Firebase field: ${key}`);
          }
          writeFileSync('public/firebase-config.json', JSON.stringify(config));
          NODE
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build frontend for GitHub Pages
        working-directory: frontend
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          BASE_HREF="/$REPOSITORY_NAME/"
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then BASE_HREF="/"; fi
          npm run build -- --base-href "$BASE_HREF"
      - name: Add SPA fallback
        working-directory: frontend
        run: cp dist/colony-info/browser/index.html dist/colony-info/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/colony-info/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5